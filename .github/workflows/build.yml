name: Build PS2 GAME STATION ELF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with PS2DEV container
        run: |
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -lc 'export PS2DEV=/usr/local/ps2dev; export PS2SDK=$PS2DEV/ps2sdk; export GSKIT=$PS2DEV/gsKit; export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin; apk add --no-cache make; command -v mips64r5900el-ps2-elf-gcc; make clean && make'

      - name: Verify ELF exists
        run: |
          test -s build/PS2_GAME_STATION.ELF
          file build/PS2_GAME_STATION.ELF

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-GAME-STATION-ELF
          path: build/PS2_GAME_STATION.ELF
          if-no-files-found: error
